# Public mega-cap defense primes — too large for the fund's pre-seed / seed stage.
# Consumed by src/collectors/defense_press.py via load_excluded_companies().
# Names are matched case-insensitively against extracted company names.
#
# noise_description_patterns (below): substring fragments. If an extracted
# entity's *description* contains one of these, it's filtered out before
# promotion to canonical_companies / companies — even if the description
# also mentions defense vocabulary. This catches media outlets, sponsors,
# think tanks, and consulting firms that get incidentally extracted from
# defense press articles.

noise_description_patterns:
  - "media outlet"
  - "publisher"
  - "news network"
  - "news organization"
  - "sponsor"            # also catches "sponsored"
  - "sponsored by"
  - "research firm"
  - "consulting firm"

excluded:
  # ── US primes ────────────────────────────────────────────────────────
