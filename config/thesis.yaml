    tier_1:
      min_score: 2.5
      label: "Strong Candidate"
      description: "High thesis fit — score ≥2.5 AND at least one validated traction signal (combat deployed, named military customer, funding raised, or multi-source validation)"
    tier_2:
      min_score: 1.8
      label: "Worth Watching"
      description: "Relevant with at least one positive signal — score ≥1.8"
    tier_3:
      min_score: 1.0
      label: "Early Signal"
      description: "In a relevant space but limited data — score ≥1.0"
    tier_4:
      min_score: 0.0
      label: "Insufficient Data"
      description: "In database but not enough information to evaluate"

