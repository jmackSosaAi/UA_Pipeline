procurement_filters:
  # CPV code prefixes used to filter ProZorro tenders at the detail level.
  # A tender passes if ANY of its items[].classification.id starts with one of these prefixes.
  # All codes are from the Common Procurement Vocabulary (CPV) standard.
  #
  # HIGH-SIGNAL DEFENSE TECH (CPV 35 subtree — included):
  cpv_prefixes:
    - "357"   # Military electronic systems — C4ISR, EW, simulators, comms
    - "356"   # Military aircraft, missiles, spacecraft — includes UAVs
    - "355"   # Warships — includes unmanned underwater/surface vehicles
    - "354"   # Military vehicles — includes UGVs, armored platforms
    - "353"   # Weapons and ammunition — catches loitering munitions
    - "3512"  # Surveillance and security systems — radar, sensors, detection
    # NON-35 DEFENSE-ADJACENT:
    - "322"   # Radio/communication/telecom equipment — battlefield comms, datalinks
    - "384"   # Precision optical and measurement equipment — EO/IR, targeting optics
  #
  # EXCLUDED (noise within CPV 35):
  #   3511 — firefighting equipment
  #   3513 — safety/protective clothing
  #   352  — police equipment (riot gear, handcuffs, sirens)
  #   358  — individual support equipment (boots, uniforms)
