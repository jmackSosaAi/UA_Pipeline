# Investment Thesis Configuration — PUBLIC
# Safe to commit. Contains scoring weights, category taxonomy, sector interests,
# geographic focus, and data sources. No personal, financial, or operational data.
#
# Sensitive fields (team, financials, LPs, brigade relationships, portfolio) live in
# config/thesis_sensitive.yaml which is gitignored. See thesis_sensitive.yaml.example.
#
# All pipeline modules read from here via src/thesis.py, which merges both files.

fund:
  name: "Example Fund"
  mission: "Back early-stage defense technology"
  stage_preference:
    - "pre-seed"
    - "seed"
  pre_product_ok: true

  geographic_focus:
    tier_1:
      - "Ukraine"
    tier_2:
      - "Estonia"
      - "Germany"
      - "Denmark"
      - "Poland"
      - "UK"
    tier_3:
      - "France"
      - "Netherlands"
      - "other NATO allies"


scoring:
  # Weights must sum to 1.0.
  # technical_founders is a Non-negotiable — weight reflects that (0.20 vs old 0.05).
  # shipped_product is a signal, not a gate — pre-product OK per fund policy (0.10 vs old 0.25).
  dimensions:
    defense_relevance:
      weight: 0.25
      description: "Does the product explicitly solve a defense or military problem?"
      scale:
        0: "No defense application"
        1: "Dual-use with weak defense case"
        2: "Clear defense application, not yet validated"
        3: "Combat-deployed or active military customer"

    technical_founders:
      weight: 0.20
      description: "Non-negotiable: technical co-founders with domain expertise"
      scale:
        0: "No technical co-founders identifiable"
        1: "Technical team but no co-founder level"
        2: "At least one technical co-founder"
        3: "Multiple technical co-founders with deep domain expertise"

    post_war_durable:
      weight: 0.15
      description: "Will revenue exist if the active war phase ends?"
      scale:
        0: "Revenue entirely dependent on active conflict"
        1: "Some peacetime application but not primary"
        2: "Clear dual-use or NATO export path"
        3: "Strong peacetime demand independent of any conflict"

    nato_exportable:
      weight: 0.15
      description: "Is the company structured to sell into NATO markets?"
      scale:
        0: "Ukrainian entity with no export structure"
        1: "Ukrainian entity with stated export ambitions"
        2: "Dual entity or NATO-country subsidiary"
        3: "Domiciled in NATO country with clean procurement path"

    stage_fit:
      weight: 0.15
      description: "Is the company at the fund's sweet spot (pre-seed/seed, pre-product OK)?"
      scale:
        0: "Series B+ or 500+ employees — too late"
        1: "Series A — borderline late for the fund"
        2: "Seed with early product"
        3: "Pre-seed or seed, small team, early stage — the fund's sweet spot"

    shipped_product:
      weight: 0.10
      description: "Evidence of a real deployed product. The fund invests pre-product — this is a signal, not a gate."
      scale:
        0: "Concept only, no prototype"
        1: "Prototype or demo exists"
        2: "Product in field testing"
        3: "Product combat-deployed or in active military use"


stage_exclusions:
  # Companies explicitly known to be too late-stage for the fund (Series B+, established primes,
  # 100+ employees). Pipeline excludes them identically to portfolio companies.
  # Add names here; exclusion applies on next run. No code changes needed.
  companies:
    - name: "Milrem Robotics"
      reason: "Estonian UGV prime — well-funded (~€100M+), Series B+, too late-stage for a pre-seed/seed mandate"


defense_categories:

